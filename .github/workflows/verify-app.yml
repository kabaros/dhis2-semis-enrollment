# workflow -> jobs -> steps

name: verify-app

on:
    pull_request:
    push:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: 'npm'
            - run: npm install --legacy-peer-deps
            - run: npm run lib
            - run: ls dist/
    lint:
        runs-on: ubuntu-latest
        needs: ['build']
        steps:
            - run: echo "lint step todo"
    tsc:
        runs-on: ubuntu-latest
        needs: ['build']
        name: 'type check'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: 'npm'
            - run: npm install --legacy-peer-deps
            - run: npm run tsc
    semantic-release:
        # needs: ['build', 'tsc', 'lint']
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: 'npm'
            - run: npm install --legacy-peer-deps
            - run: npx semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.SEMIS_BOT_TOKEN }}